name: Publish Watchr MCP to official registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher v1.8.7
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base=https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity 'https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/v1.8.7' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Authenticate and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
